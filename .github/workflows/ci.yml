name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 同じブランチに連続 push した場合、古い実行をキャンセルして無駄を省く
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest \
            tests/test_security.py \
            tests/test_build_dynamic_sql.py \
            tests/test_query_maps.py \
            tests/test_llm_evaluation.py \
            -v --tb=short \
            --cov=app --cov-report=term-missing

  lint:
    name: ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.16.1

      - name: Run ruff
        run: ruff check .
