      - "./backend"

  # ----------------------------------------------------------------------
  # 2. ビルドしたDockerイメージをContainer Registryにプッシュ
  # ----------------------------------------------------------------------
  - id: "backend-push-image"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/${PROJECT_ID}/mlb-diamond-lens-api:latest"

  # # # ----------------------------------------------------------------------
