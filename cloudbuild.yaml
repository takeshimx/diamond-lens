  # # #     - 'HIGH,CRITICAL'
  # # #     - '--ignore-unfixed'
  # # #     - 'gcr.io/${PROJECT_ID}/mlb-diamond-lens-api:latest'

  # # # _GIT_TAG はGitタグがプッシュされた場合に自動的に設定されます。${_GIT_TAG} はそのタグ名を参照します。
  # # # それ以外の場合（例: ブランチへのプッシュ）は空になり、エラーになります。
  # # # その場合は、例えばコミットSHAを使うなど、別のタグ付け戦略を検討してください。
  # # # 例: 'gcr.io/${PROJECT_ID}/mlb-analytics-api:latest' または 'gcr.io/${PROJECT_ID}/mlb-analytics-api:$COMMIT_SHA'

  # ----------------------------------------------------------------------
  # 4. Cloud Runにデプロイ
  # ----------------------------------------------------------------------
  - id: "backend-deploy-cloudrun"
    name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "deploy"
      - "mlb-diamond-lens-api"
      - "--image"
      - "gcr.io/${PROJECT_ID}/mlb-diamond-lens-api:latest"
      - "--region"
      - "asia-northeast1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--memory"
      - "1Gi"
      - "--port"
      - "8080"
      # 用語集/ルール RAG のフラグ。ローカルは .env で与えるが、.env は
      # .gitignore 対象でイメージに入らないため、Cloud Run では明示的に渡す。
      #   USE_GLOSSARY_RAG    : glossary_search_tool をツール一覧に加える
      #   USE_GLOSSARY_RERANK : 候補を LLM で並べ直す
      #   USE_GLOSSARY_HYDE   : rules に限り質問を英語の条文風に書き換えて埋め込む
      # 3 つとも true でないと ADR-054 の実測値 (rule 型 命中@3 0.833) にならない。
      # --set-env-vars ではなく --update-env-vars を使う。前者は既存の環境変数を
      # 全消しするため、コンソール等で個別設定した値を巻き込んで壊す。
      - "--update-env-vars"
      - "USE_GLOSSARY_RAG=true,USE_GLOSSARY_RERANK=true,USE_GLOSSARY_HYDE=true"

  # ----------------------------------------------------------------------
  # 4. フロントエンド (React) のDockerイメージをビルド
  # ----------------------------------------------------------------------
  - id: "frontend-build-image"
    name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        echo "Building frontend with password from Secret Manager..."
        docker build -t gcr.io/${PROJECT_ID}/mlb-diamond-lens-frontend:latest \
          --build-arg VITE_FIREBASE_API_KEY="AIzaSyCEwxBGkkzuav8v1cBdqa2KsFf2CQXi3fQ" \
          --build-arg VITE_FIREBASE_AUTH_DOMAIN="tksm-dash-test-25.firebaseapp.com" \
          --build-arg VITE_FIREBASE_PROJECT_ID="tksm-dash-test-25" \
          --build-arg VITE_FIREBASE_STORAGE_BUCKET="tksm-dash-test-25.firebasestorage.app" \
          --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID="907924272679" \
          --build-arg VITE_FIREBASE_APP_ID="1:907924272679:web:54447482c648cf7154c002" \
          --build-arg VITE_USE_AUTOCOMPLETE_API="true" \
          ./frontend

  # ----------------------------------------------------------------------
  # 5. フロントエンドのDockerイメージをプッシュ
  # ----------------------------------------------------------------------
  - id: "frontend-push-image"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/${PROJECT_ID}/mlb-diamond-lens-frontend:latest"

  # ----------------------------------------------------------------------
  # 6. Security Scanning (脆弱性スキャン) - DISABLED (課金対策)
  # ----------------------------------------------------------------------
  # - id: 'frontend-security-scan'
  #   name: 'aquasec/trivy'
  #   args:
  #     - 'image'
  #     - '--exit-code'
  #     - '1'
  #     - '--severity'
  #     - 'HIGH,CRITICAL'
  #     - '--ignore-unfixed'
  #     - 'gcr.io/${PROJECT_ID}/mlb-diamond-lens-frontend:latest'

  # ----------------------------------------------------------------------
  # 7. フロントエンドをCloud Runにデプロイ
  # ----------------------------------------------------------------------
  - id: "frontend-deploy-cloudrun"
    name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "deploy"
      - "mlb-diamond-lens-frontend"
      - "--image"
      - "gcr.io/${PROJECT_ID}/mlb-diamond-lens-frontend:latest"
      - "--region"
      - "asia-northeast1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--port"
      - "8080"
      - "--clear-secrets"

# Secret Manager から環境変数を取得
#
# ここは STEP 1.1 (llm-evaluation-gate) とセットで管理する。あのステップは
# ビルドコンテナ内で Gemini を直接叩くため、Cloud Run サービス側のシークレット
# 紐付けは届かない。片方だけ有効にすると
#   invalid secrets: secretEnv "GEMINI_API_KEY_V2" is used without being defined
# でビルドが解析段階で拒否される（ステップ 0 個で失敗する）。
availableSecrets:
  secretManager:
    # STEP 1.1 の精度ゲートがゴールデンデータセットを採点するために使う
    - versionName: projects/${PROJECT_ID}/secrets/GEMINI_API_KEY_V2/versions/latest
      env: "GEMINI_API_KEY_V2"
#     # private な mlb-analytics-data-dbt を submodule として clone するための GitHub PAT
#     # （使用ステップ init-submodules が無効なため、こちらも無効のまま）
#     - versionName: projects/${PROJECT_ID}/secrets/github-pat/versions/latest
#       env: "GITHUB_PAT"
#     # 既存の他 Secret は必要時にコメント解除
#     # - versionName: projects/${PROJECT_ID}/secrets/VITE_APP_PASSWORD_V2/versions/latest
#     #   env: 'VITE_APP_PASSWORD_V2'
#     # - versionName: projects/${PROJECT_ID}/secrets/NOTIFICATION_EMAIL_V2/versions/latest
#     #   env: 'NOTIFICATION_EMAIL_V2'

# トリガー実行時のエラーを回避するため、ログの保存先を明示的に指定
options:
  logging: CLOUD_LOGGING_ONLY # ログの保存先をCloud Loggingのみに設定
