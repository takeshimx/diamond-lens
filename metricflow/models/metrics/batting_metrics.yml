metrics:
  - name: batting_average
    label: "Batting Average"
    type: simple
    type_params:
      measure: avg
  - name: on_base_pct
    label: "On-Base Percentage"
    type: simple
    type_params:
      measure: obp
  - name: ops_metric
    label: "OPS"
    type: simple
    type_params:
      measure: ops     # mart の pre-computed 値をそのまま公開
  - name: weighted_on_base_avg
    label: "Weighted On-Base Average (wOBA)"
    type: simple
    type_params:
      measure: woba
  - name: slugging_pct
    label: "Slugging Percentage (SLG)"
    type: simple
    type_params:
      measure: slg
  - name: hits_total
    label: "Hits"
    type: simple
    type_params:
      measure: hits
  - name: at_bats_total
    label: "At Bats"
    type: simple
    type_params:
      measure: at_bats
  - name: plate_appearances_total
    label: "Plate Appearances"
    type: simple
    type_params:
      measure: plate_appearances
  - name: home_runs_total
    label: "Home Runs"
    type: simple
    type_params:
      measure: home_runs
  - name: walks_total
    label: "Walks"
    type: simple
    type_params:
      measure: walks
  - name: strikeouts_total
    label: "Strikeouts"
    type: simple
    type_params:
      measure: strikeouts
  - name: runs_batted_in_total
    label: "Runs Batted In (RBI)"
    type: simple
    type_params:
      measure: runs_batted_in
  - name: weighted_runs_created_plus
    label: "Weighted Runs Created Plus (wRC+)"
    type: simple
    type_params:
      measure: wrc_plus
  - name: hard_hit_rate
    label: "Hard Hit Rate"
    type: simple
    type_params:
      measure: hard_hit_pct
  - name: barrel_rate
    label: "Barrel Rate"
    type: simple
    type_params:
      measure: barrel_pct
  - name: risp_batting_average_season
    label: "RISP Batting Average (Season)"
    type: simple
    type_params:
      measure: risp_avg

# ── batter_clutch ─────────────────────────────────────────────────────────────
# situation_type の値: 'bases_loaded' | 'risp' | 'on_1b' | 'no_runner'

  # 状況横断（クエリ時に situation_type ディメンションで絞り込む）
  - name: clutch_woba
    label: "Clutch wOBA"
    type: simple
    type_params:
      measure: clutch_woba

  - name: clutch_xwoba
    label: "Clutch xwOBA"
    type: simple
    type_params:
      measure: clutch_xwoba

  - name: clutch_ops
    label: "Clutch OPS"
    type: simple
    type_params:
      measure: clutch_ops

  - name: clutch_batting_average
    label: "Clutch Batting Average (H/AB)"
    type: simple
    type_params:
      measure: clutch_avg

  - name: clutch_hard_hit_rate
    label: "Clutch Hard Hit Rate"
    type: simple
    type_params:
      measure: clutch_hard_hit_rate

  - name: clutch_barrel_rate
    label: "Clutch Barrel Rate"
    type: simple
    type_params:
      measure: clutch_barrels_rate

  # RISP 固定（situation_type = 'risp'）
  - name: risp_batting_average
    label: "RISP Batting Average"
    type: simple
    type_params:
      measure: clutch_avg
    filter: |
      {{ Dimension('player__situation_type') }} = 'risp'

  - name: risp_woba
    label: "RISP wOBA"
    type: simple
    type_params:
      measure: clutch_woba
    filter: |
      {{ Dimension('player__situation_type') }} = 'risp'

  - name: risp_strikeout_rate
    label: "RISP Strikeout Rate"
    type: simple
    type_params:
      measure: clutch_strikeout_rate
    filter: |
      {{ Dimension('player__situation_type') }} = 'risp'

  # 満塁固定（situation_type = 'bases_loaded'）
  - name: bases_loaded_batting_average
    label: "Bases Loaded Batting Average"
    type: simple
    type_params:
      measure: clutch_avg
    filter: |
      {{ Dimension('player__situation_type') }} = 'bases_loaded'

  - name: bases_loaded_woba
    label: "Bases Loaded wOBA"
    type: simple
    type_params:
      measure: clutch_woba
    filter: |
      {{ Dimension('player__situation_type') }} = 'bases_loaded'

# ── batter_monthly ────────────────────────────────────────────────────────────

  - name: monthly_batting_average
    label: "Monthly Batting Average"
    type: simple
    type_params:
      measure: monthly_batting_average

  - name: monthly_ops
    label: "Monthly OPS"
    type: simple
    type_params:
      measure: monthly_ops

  - name: monthly_home_runs
    label: "Monthly Home Runs"
    type: simple
    type_params:
      measure: monthly_home_runs

# ── pitcher_by_inning ─────────────────────────────────────────────────────────

  - name: era_by_inning
    label: "ERA by Inning"
    type: simple
    type_params:
      measure: era_by_inning

  - name: era_first_inning
    label: "1st Inning ERA"
    type: simple
    type_params:
      measure: era_by_inning
    filter: |
      CAST({{ Dimension('pitcher__inning') }} AS INT64) = 1

# ── pitcher_by_stand ──────────────────────────────────────────────────────────

  - name: era_vs_lhb
    label: "ERA vs Left-Handed Batters"
    type: simple
    type_params:
      measure: era_vs_stand
    filter: |
      {{ Dimension('pitcher__stand') }} = 'L'

  - name: era_vs_rhb
    label: "ERA vs Right-Handed Batters"
    type: simple
    type_params:
      measure: era_vs_stand
    filter: |
      {{ Dimension('pitcher__stand') }} = 'R'

# ── pitcher_by_runner ─────────────────────────────────────────────────────────
# situation の値: 'risp' | 'non_risp'

  - name: pitcher_risp_xwoba
    label: "Pitcher xwOBA with RISP"
    type: simple
    type_params:
      measure: pitcher_xwoba
    filter: |
      {{ Dimension('pitcher__situation') }} = 'risp'

  - name: pitcher_non_risp_xwoba
    label: "Pitcher xwOBA without RISP"
    type: simple
    type_params:
      measure: pitcher_xwoba
    filter: |
      {{ Dimension('pitcher__situation') }} = 'non_risp'

  - name: pitcher_risp_k_pct
    label: "Pitcher K% with RISP"
    type: simple
    type_params:
      measure: pitcher_k_pct
    filter: |
      {{ Dimension('pitcher__situation') }} = 'risp'

  - name: pitcher_risp_baa
    label: "Pitcher BAA with RISP"
    type: simple
    type_params:
      measure: pitcher_baa
    filter: |
      {{ Dimension('pitcher__situation') }} = 'risp'

