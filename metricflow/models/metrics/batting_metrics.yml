# ── batter_by_inning ──────────────────────────────────────────────────────────
# inning はクエリ時にディメンションで絞り込む

  - name: inning_avg
    label: "Batting Average by Inning"
    type: simple
    type_params:
      measure: inning_avg

  - name: inning_ops
    label: "OPS by Inning"
    type: simple
    type_params:
      measure: inning_ops

  - name: inning_hard_hit_rate
    label: "Hard Hit Rate by Inning"
    type: simple
    type_params:
      measure: inning_hard_hit_rate

  - name: inning_batting_average
    label: "Batting Average by Inning (H/AB)"
    type: simple
    type_params:
      measure: inning_avg

  - name: early_inning_avg
    label: "Early Inning Batting Average (1-3)"
    type: simple
    type_params:
      measure: inning_avg
    filter: |
      CAST({{ Dimension('player__inning') }} AS INT64) <= 3

  - name: late_inning_avg
    label: "Late Inning Batting Average (7+)"
    type: simple
    type_params:
      measure: inning_avg
    filter: |
      CAST({{ Dimension('player__inning') }} AS INT64) >= 7

# ── batter_by_pitch_type ──────────────────────────────────────────────────────
# pitch_name はクエリ時にディメンションで絞り込む（例: 'FF', 'SL', 'CH' 等）

  - name: pitch_type_avg
    label: "Batting Average by Pitch Type"
    type: simple
    type_params:
      measure: pitch_avg

  - name: pitch_type_ops
    label: "OPS by Pitch Type"
    type: simple
    type_params:
      measure: pitch_ops

  - name: pitch_type_swinging_strike_rate
    label: "Swinging Strike Rate by Pitch Type"
    type: simple
    type_params:
      measure: pitch_swinging_strike_rate

  - name: pitch_type_hard_hit_rate
    label: "Hard Hit Rate by Pitch Type"
    type: simple
    type_params:
      measure: pitch_hard_hit_rate

  - name: vs_fastball_avg
    label: "Batting Average vs Fastball (4-seam)"
    type: simple
    type_params:
      measure: pitch_avg
    filter: |
      {{ Dimension('player__pitch_name') }} = 'FF'

  - name: vs_slider_avg
    label: "Batting Average vs Slider"
    type: simple
    type_params:
      measure: pitch_avg
    filter: |
      {{ Dimension('player__pitch_name') }} = 'SL'

  - name: vs_changeup_ops
    label: "OPS vs Changeup"
    type: simple
    type_params:
      measure: pitch_ops
    filter: |
      {{ Dimension('player__pitch_name') }} = 'CH'
