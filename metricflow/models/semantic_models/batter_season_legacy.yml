semantic_models:
  - name: batter_season_legacy
    model: ref('fact_batting_stats_with_risp')
    # FanGraphs ベースのレガシーテーブル。主キーは idfg (FanGraphs ID)。
    # 新しい mart は mlbId (Statcast) を使用。両者の結合キーは mlbId カラムで可能。
    defaults:
      agg_time_dimension: season
    entities:
      - {name: player_fg, type: primary, expr: idfg}    # FanGraphs ID (INTEGER)
      - {name: team,      type: foreign, expr: team}     # チーム略称 STRING
    dimensions:
      - name: season
        type: time
        type_params:
          time_granularity: year
        expr: DATE(season, 1, 1)
    measures:
      # ── 生カウント（SUM で集約可能） ──────────────────────────────────────────
      - {name: fg_games,            agg: sum, expr: g}
      - {name: fg_ab,               agg: sum, expr: ab}
      - {name: fg_pa,               agg: sum, expr: pa}
      - {name: fg_hits,             agg: sum, expr: h}
      - {name: fg_home_runs,        agg: sum, expr: hr}
      - {name: fg_runs,             agg: sum, expr: r}
      - {name: fg_rbi,              agg: sum, expr: rbi}
      - {name: fg_walks,            agg: sum, expr: bb}
      - {name: fg_strikeouts,       agg: sum, expr: so}
      - {name: fg_hbp,              agg: sum, expr: hbp}
      - {name: fg_stolen_bases,     agg: sum, expr: sb}
      - {name: fg_barrels,          agg: sum, expr: barrels}
      - {name: fg_hard_hit,         agg: sum, expr: hardhit}
      # 注意: 1b/2b/3b は数字始まりのカラム名のため measures から除外。
      # 直接 SQL で参照する場合は BigQuery バッククォートが必要: `1b`, `2b`, `3b`

      # ── pre-computed ratios（1選手×シーズン1行のため average で集約） ──────────
      # 標準打撃指標
      - {name: fg_avg,              agg: average, expr: avg}
      - {name: fg_obp,              agg: average, expr: obp}
      - {name: fg_slg,              agg: average, expr: slg}
      - {name: fg_ops,              agg: average, expr: ops}
      - {name: fg_iso,              agg: average, expr: iso}
      - {name: fg_babip,            agg: average, expr: babip}
      - {name: fg_woba,             agg: average, expr: woba}
      - {name: fg_wrc_plus,         agg: average, expr: wrcplus}
      - {name: fg_war,              agg: average, expr: war}
      # プレート規律
      - {name: fg_bb_pct,           agg: average, expr: bbpct}
      - {name: fg_k_pct,            agg: average, expr: kpct}
      - {name: fg_swstr_pct,        agg: average, expr: swstrpct}
      - {name: fg_contact_pct,      agg: average, expr: contactpct}
      - {name: fg_zone_pct,         agg: average, expr: zonepct}
      # 打球傾向
      - {name: fg_pull_pct,         agg: average, expr: pullpct}
      - {name: fg_cent_pct,         agg: average, expr: centpct}
      - {name: fg_oppo_pct,         agg: average, expr: oppopct}
      - {name: fg_hard_pct,         agg: average, expr: hardpct}
      - {name: fg_barrel_pct,       agg: average, expr: barrelpct}
      - {name: fg_hard_hit_pct,     agg: average, expr: hardhitpct}
      - {name: fg_avg_exit_velo,    agg: average, expr: ev}
      - {name: fg_avg_launch_angle, agg: average, expr: la}
      # 期待値指標
      - {name: fg_xba,              agg: average, expr: xba}
      - {name: fg_xwoba,            agg: average, expr: xwoba}
      # 高度指標
      - {name: fg_wpa,              agg: average, expr: wpa}
      - {name: fg_clutch,           agg: average, expr: clutch}

      # ── RISP 指標（season_risp CTE より結合済み） ──────────────────────────────
      - {name: fg_hits_at_risp,     agg: sum,     expr: hits_at_risp}
      - {name: fg_hr_at_risp,       agg: sum,     expr: home_runs_at_risp}
      - {name: fg_ab_at_risp,       agg: sum,     expr: at_bats_at_risp}
      - {name: fg_avg_at_risp,      agg: average, expr: batting_average_at_risp}
      - {name: fg_slg_at_risp,      agg: average, expr: slugging_percentage_at_risp}
