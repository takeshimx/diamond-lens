semantic_models:
  - name: batter_season
    model: ref('mart_batter_season_stats')
    defaults:
      agg_time_dimension: batter_main_season
    entities:
      - {name: player, type: primary, expr: batter}   # batter = mlbid (INT64)。idfg ではない
      - {name: team, type: foreign, expr: team}        # team = チーム略称 STRING。team_id ではない
    dimensions:
      - name: batter_main_season
        type: time
        type_params:
          time_granularity: year
        expr: DATE(season, 1, 1)
      # season(INT64) を直接フィルタ用の categorical 別名で公開
      # batter_by_inning が同名 'season' を time dim として持つため別名にする
      - {name: season_year, type: categorical, expr: season}
      # 注意: split_type 次元はこのテーブルに存在しない。
      # RISP等のスプリット指標は tbl_batter_split_stats (batter_split モデル) で定義する。
      # mart には risp_avg カラムとして pre-computed 値が格納されている。
    measures:
      # 生カウント（SUM で集約可能）
      - {name: hits,             agg: sum,     expr: h}
      - {name: at_bats,          agg: sum,     expr: ab}
      - {name: plate_appearances,agg: sum,     expr: pa}
      - {name: home_runs,        agg: sum,     expr: hr}
      - {name: walks,            agg: sum,     expr: bb}
      - {name: strikeouts,       agg: sum,     expr: so}
      - {name: runs_batted_in,   agg: sum,     expr: rbi}
      # pre-computed ratios（1選手1シーズン1行のため average で集約）
      # total_bases カラムは mart に存在しないため slugging を ratio で定義不可。slg を直参照する。
      - {name: avg,              agg: average, expr: avg}
      - {name: obp,              agg: average, expr: obp}
      - {name: slg,              agg: average, expr: slg}
      - {name: ops,              agg: average, expr: ops}
      - {name: woba,             agg: average, expr: woba}
      - {name: wrc_plus,         agg: average, expr: wrc_plus}
      - {name: hard_hit_pct,     agg: average, expr: hardhitpct}
      - {name: barrel_pct,       agg: average, expr: barrelpct}
      - {name: risp_avg,         agg: average, expr: risp_avg}