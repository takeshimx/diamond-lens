semantic_models:
  - name: pitcher_by_runner
    model: ref('mart_pitcher_risp_performance')
    defaults:
      agg_time_dimension: runner_season
    entities:
      - {name: pitcher, type: primary, expr: pitcher}   # pitcher = mlbid (INT64)
      - {name: team,    type: foreign, expr: team}       # チーム略称 STRING
    dimensions:
      - name: runner_season
        type: time
        type_params:
          time_granularity: year
        expr: DATE(season, 1, 1)
      - {name: situation, type: categorical}              # 'risp' | 'non_risp'
    measures:
      # 生カウント（SUM で集約可能）
      - {name: runner_pa,         agg: sum, expr: pa}
      - {name: runner_hits,       agg: sum, expr: hits}
      - {name: runner_home_runs,  agg: sum, expr: home_runs}
      # pre-computed ratios（1投手×シーズン×situation で1行のため average で集約）
      - {name: pitcher_baa,           agg: average, expr: baa}        # 被打率
      - {name: pitcher_xwoba,         agg: average, expr: xwoba}
      - {name: pitcher_k_pct,         agg: average, expr: k_pct}
      - {name: pitcher_bb_pct,        agg: average, expr: bb_pct}
      - {name: pitcher_hard_hit_pct,  agg: average, expr: hard_hit_pct}
