semantic_models:
  - name: batter_by_inning
    model: ref('mart_batter_inning_stats')
    defaults:
      agg_time_dimension: season
    entities:
      - {name: player, type: primary, expr: batter_id}   # batter_id = mlbid (INTEGER)
      - {name: team,   type: foreign, expr: team}
    dimensions:
      - name: season
        type: time
        type_params:
          time_granularity: year
        expr: DATE(game_year, 1, 1)
      - {name: inning, type: categorical}   # 1–9+（イニング番号）
    measures:
      # ── 生カウント（SUM で集約可能） ──────────────────────────────────────────
      - {name: inning_ab,                    agg: sum, expr: ab_by_inning}
      - {name: inning_hits,                  agg: sum, expr: hits_by_inning}
      - {name: inning_singles,               agg: sum, expr: singles_by_inning}
      - {name: inning_doubles,               agg: sum, expr: doubles_by_inning}
      - {name: inning_triples,               agg: sum, expr: triples_by_inning}
      - {name: inning_home_runs,             agg: sum, expr: homeruns_by_inning}
      - {name: inning_bb_hbp,                agg: sum, expr: bb_hbp_by_inning}
      - {name: inning_strikeouts,            agg: sum, expr: so_by_inning}
      - {name: inning_hard_hit_count,        agg: sum, expr: hard_hit_count_by_inning}
      - {name: inning_barrels_count,         agg: sum, expr: barrels_count_by_inning}
      - {name: inning_total_batted_balls,    agg: sum, expr: total_batted_balls_by_inning}
      - {name: inning_swinging_strike_count, agg: sum, expr: swinging_strike_count_by_inning}

      # ── pre-computed ratios（1選手×シーズン×イニングで1行のため average で集約） ─
      - {name: inning_avg,                   agg: average, expr: avg_by_inning}
      - {name: inning_obp,                   agg: average, expr: obp_by_inning}
      - {name: inning_slg,                   agg: average, expr: slg_by_inning}
      - {name: inning_ops,                   agg: average, expr: ops_by_inning}
      - {name: inning_hard_hit_rate,         agg: average, expr: hard_hit_rate_by_inning}
      - {name: inning_barrels_rate,          agg: average, expr: barrels_rate_by_inning}
      - {name: inning_strikeout_rate,        agg: average, expr: strikeout_rate_by_inning}
      - {name: inning_swinging_strike_rate,  agg: average, expr: swinging_strike_rate_by_inning}

      # ── Statcast 平均値（既に平均のため average で集約） ─────────────────────
      - {name: inning_avg_exit_velocity,     agg: average, expr: exit_velocity_by_inning}
      - {name: inning_avg_launch_angle,      agg: average, expr: launch_angle_by_inning}
      - {name: inning_avg_bat_speed,         agg: average, expr: bat_speed_by_inning}
      - {name: inning_avg_swing_length,      agg: average, expr: swing_length_by_inning}
