semantic_models:
  - name: batter_monthly
    model: ref('tbl_batter_offensive_stats_monthly')
    defaults:
      agg_time_dimension: monthly_season
    entities:
      - {name: player, type: primary, expr: batter_id}   # batter_id = mlbid (INT64)
      # 注意: このテーブルにチームカラムは存在しない
    dimensions:
      - name: monthly_season
        type: time
        type_params:
          time_granularity: year
        expr: DATE(game_year, 1, 1)
      - {name: game_month, type: categorical}   # 1–9 (MLB 開幕月〜終盤)
    measures:
      # 生カウント（SUM で集約可能）
      - {name: monthly_hits,          agg: sum, expr: hits}
      - {name: monthly_home_runs,     agg: sum, expr: home_runs}
      - {name: monthly_doubles,       agg: sum, expr: doubles}
      - {name: monthly_triples,       agg: sum, expr: triples}
      - {name: monthly_singles,       agg: sum, expr: singles}
      - {name: monthly_walks_and_hbp, agg: sum, expr: walks_and_hbp}
      - {name: monthly_at_bats,       agg: sum, expr: at_bats}
      # pre-computed ratios（1選手×シーズン×月で1行のため average で集約）
      - {name: monthly_batting_average, agg: average, expr: batting_average}
      - {name: monthly_obp,             agg: average, expr: on_base_percentage}
      - {name: monthly_slg,             agg: average, expr: slugging_percentage}
      - {name: monthly_ops,             agg: average, expr: on_base_plus_slugging}
