version: 2

models:
  - name: fact_batting_stats_master
    description: "Master fact table for batting statistics, incrementally updated from weekly staging data"
    columns:
      - name: idfg
        description: "Fangraphs player ID"
        tests:
          - not_null
      - name: season
        description: "Season year"
        tests:
          - not_null

  - name: fact_pitching_stats_master
    description: "Master fact table for pitching statistics, incrementally updated from weekly staging data"
    columns:
      - name: idfg
        description: "Fangraphs player ID"
        tests:
          - not_null
      - name: season
        description: "Season year"
        tests:
          - not_null

  - name: statcast_master
    description: "Master table for all Statcast data since 2021, incrementally updated from staging"
    columns:
      - name: game_pk
        description: "Unique game identifier"
        tests:
          - not_null
      - name: pitch_number
        description: "Pitch number in the game"
        tests:
          - not_null
      - name: at_bat_number
        description: "At-bat number in the game"
        tests:
          - not_null
      - name: game_date
        description: "Game date"
        tests:
          - not_null
      - name: game_year
        description: "Game year"
        tests:
          - not_null
      - name: pitcher
        description: "Pitcher MLB ID"
        tests:
          - not_null
      - name: batter
        description: "Batter MLB ID"
        tests:
          - not_null
