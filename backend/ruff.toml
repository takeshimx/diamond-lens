target-version = "py311"
line-length = 120

exclude = [
    ".venv",
    "venv",
    "**/__pycache__",
    "app/services/ai_service_backup_02102026.py",  # バックアップファイル
]

[lint]
# 最初は「明確なバグ」だけに絞る。E501(行長) 等は後から足す
select = [
    "F",    # pyflakes: 未定義変数、未使用 import など
    "E9",   # 構文エラー・IndentationError
    "B",    # flake8-bugbear: 引数のミュータブルデフォルト等の実バグ
]

# 既存の指摘 134 件はいったん凍結し、新規コードの混入だけを止める。
# 上から順に解消していき、片付いたら ignore から外す。
ignore = [
    "F401",  # unused import — 既存コードに多数あるため段階的に対応
    "F601",  # TODO(高): METRIC_MAP の "strikeouts" 重複キー。打者側 12 マッピングが消失中
    "B023",  # 3 件。同一イテレーション内で消費しているため現状は実害なし
    "F541",  # 45 件。`ruff check --select F541 --fix` で一括修正可
    "B904",  # 50 件。raise ... from e への書き換えが必要
    "F403",  # star import 4 ファイル（leaderboard / player / statcast）
    "F405",  # 上記 star import に起因
    "F841",  # 4 件。未使用ローカル変数
    "B007",  # 1 件
    "B905",  # 1 件。zip(..., strict=) 未指定
]

# FastAPI の Query / Depends 等はデフォルト引数での呼び出しが正規の書き方なので
# B008 の対象から除外する
[lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Query",
    "fastapi.Depends",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]
